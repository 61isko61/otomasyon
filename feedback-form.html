<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geri Bildirim Formu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s ease;
        }
        textarea:focus {
            outline: none;
            border-color: #f5576c;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #f5576c;
        }
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .submit-btn {
            background: #f5576c;
            color: white;
            grid-column: 1 / -1;
        }
        .submit-btn:hover:not(:disabled) {
            background: #f093fb;
            transform: translateY(-2px);
        }
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .cancel-btn {
            background: #e8e8e8;
            color: #333;
        }
        .cancel-btn:hover {
            background: #d8d8d8;
        }
        .success {
            display: none;
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .loading {
            display: none;
            text-align: center;
            color: #f5576c;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Biz Daha İyi Olabilir Miyiz?</h1>
        <p class="subtitle">Lütfen iyileştirmelerimiz için önerilerinizi yazın</p>
        
        <div class="success" id="success-msg">
            ✓ Teşekkür ederiz! Geri bildiriminiz kaydedildi.
        </div>

        <div class="form-group">
            <label for="yorum">Detaylı Yorum *</label>
            <textarea id="yorum" placeholder="Lütfen ne yaptığımızı daha iyi yapabiliriz? Hangi konular sorun yaşadınız?" required></textarea>
        </div>

        <div class="form-group">
            <label for="iletisim">İletişim Bilgisi (İsteğe Bağlı)</label>
            <input type="text" id="iletisim" placeholder="E-mail veya telefon - dönüş yapmak için">
        </div>

        <div class="button-group">
            <button class="cancel-btn" onclick="window.location.href='/'">Geri Dön</button>
            <button class="submit-btn" id="gonder-btn" onclick="gonder()">Gönder</button>
        </div>

        <div class="loading" id="loading">Yükleniyor...</div>
    </div>

    <script>
        function gonder() {
            const yorum = document.getElementById('yorum').value.trim();

            if (!yorum) {
                alert('Lütfen bir yorum yazın');
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('gonder-btn').disabled = true;

            // Geri bildirim veritabanında zaten kaydedildi, burada sadece ek bilgi gösteriyoruz
            setTimeout(() => {
                document.getElementById('success-msg').style.display = 'block';
                document.getElementById('loading').style.display = 'none';
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
            }, 500);
        }

        // Enter tuşuyla gönderme
        document.getElementById('yorum').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                gonder();
            }
        });
    </script>
</body>
</html>
